[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-akapulu"
version = "0.1.6"
description = "Pipecat processor that sends assistant audio to an Akapulu Labs avatar."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Akapulu Labs" }]
keywords = ["pipecat", "akapulu", "avatar", "webrtc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pipecat-ai>=1.12.0",
    "websockets>=13.1,<16",
]

[project.urls]
Homepage = "https://akapulu.com"
Repository = "https://github.com/Akapulu/pipecat-akapulu"
Documentation = "https://docs.akapulu.com"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_akapulu"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
